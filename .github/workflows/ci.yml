name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 集成测试（网盘权限、回收站、外链、相册、垃圾回收）跑在真实 PostgreSQL 上
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: privatechat
          POSTGRES_PASSWORD: privatechat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U privatechat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PC_TEST_PG: Host=localhost;Port=5432;Username=privatechat;Password=privatechat;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore tests/PrivateChat.Api.Tests
      - run: dotnet build tests/PrivateChat.Api.Tests -c Release --no-restore
      - run: dotnet test tests/PrivateChat.Api.Tests -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run type-check --if-present
      - run: npm test
      - run: npm run test:e2e-cli
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
