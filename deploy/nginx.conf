# PrivateChat 前端托管 + 反向代理（草案 v0.3）
# TLS 在 Cloudflare 边缘终结，这里只听明文 HTTP：
#   :80    只被同一 compose 网络里的 cloudflared 访问（不映射到宿主机）
#   :8080  可选映射到局域网，断外网时直连；此端口会清掉 Access 身份头，api 回退到密码登录
# 通话媒体走 Cloudflare Realtime，不经过这里。

resolver 127.0.0.11 valid=30s ipv6=off;   # Docker 内置 DNS：按需解析，api 未启动时 nginx 也能起来

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 只有来自 cloudflared（:80）的请求才允许携带 Access 身份头
map $server_port $cf_access_jwt {
    80      $http_cf_access_jwt_assertion;
    default "";
}

# :80 的请求在 Cloudflare 侧是 HTTPS；:8080 局域网直连是 HTTP
map $server_port $fwd_proto {
    80      https;
    default http;
}

server {
    listen 80;
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;          # tus 分片 8 MB；Cloudflare 免费版单请求上限 100 MB
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    set $api http://api:8080;

    # 带 hash 的构建产物永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 回退。index.html、sw.js、manifest 等不带 hash 的文件每次都向服务器确认（有 ETag，没变就 304），
    # 否则浏览器启发式缓存可能让 PWA 迟迟拿不到新版本
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # REST / tus 上传 / 媒体下载 / 分享链接 / OpenAPI / 健康检查
    location ~ ^/(api|s|openapi|healthz)(/|$) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion $cf_access_jwt;
        proxy_request_buffering off;   # tus 分片直通，不落 nginx 临时文件
        proxy_buffering off;           # 大文件 / Range 下载直接流出
        proxy_read_timeout 300s;
    }

    # SignalR 与远程控制 WebSocket 中继（Cloudflare 空闲约 100 s 断开，应用层每 15 s 心跳）
    location ~ ^/(hubs|ws)/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion $cf_access_jwt;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
