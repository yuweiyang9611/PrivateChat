# 测试栈的 sfu-relay 容器用（见 test-host.override.yml）：宿主机 docker0 上的 8799 → 宿主机回环的 8799（SSH 隧道的入口）。
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/sfu-relay.pid;
events {}
stream {
    server {
        listen 172.17.0.1:8799;
        proxy_pass 127.0.0.1:8799;
        proxy_connect_timeout 3s;
    }
}
